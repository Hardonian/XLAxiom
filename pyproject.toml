[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xlaxiom"
version = "0.5.0"
description = "Differential testing, failure minimization, and reproducible evidence for JAX/OpenXLA workloads."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "XLAxiom contributors" }]
keywords = ["jax", "openxla", "compiler", "differential-testing", "numerical-testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["numpy>=2.0", "jax>=0.5"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
xlaxiom = "xlaxiom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xlaxiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
ignore_missing_imports = true
