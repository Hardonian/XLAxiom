[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xlaxiom"
dynamic = ["version"]
description = "Universal numerical verification, kernel fuzzing, and differential testing for PyTorch, JAX, Triton, and OpenXLA."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "XLAxiom contributors" }]
keywords = [
  "assert-close",
  "compiler-testing",
  "differential-testing",
  "failure-minimization",
  "fp8",
  "jax",
  "kernel-fuzzing",
  "numerical-testing",
  "openxla",
  "pallas",
  "property-based-testing",
  "pytorch",
  "quantization",
  "reproducibility",
  "triton",
  "xla",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/Hardonian/XLAxiom"
Documentation = "https://github.com/Hardonian/XLAxiom#readme"
Repository = "https://github.com/Hardonian/XLAxiom"
Issues = "https://github.com/Hardonian/XLAxiom/issues"
Changelog = "https://github.com/Hardonian/XLAxiom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "jax>=0.4.30",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "safetensors>=0.4",
  "twine>=6.1",
]
jax = ["jax>=0.4.30"]
torch = ["torch>=2.0"]
hf = ["safetensors>=0.4"]
cuda12 = ["jax[cuda12]>=0.5,<0.11; platform_system == 'Linux'"]
cuda13 = ["jax[cuda13]>=0.5,<0.11; platform_system == 'Linux'"]
all = ["jax>=0.4.30", "torch>=2.0", "safetensors>=0.4"]

[project.scripts]
xlaxiom = "xlaxiom.cli:main"

[project.entry-points.pytest11]
xlaxiom = "xlaxiom.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/xlaxiom"]

[tool.hatch.version]
path = "src/xlaxiom/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/colab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
ignore_missing_imports = true
