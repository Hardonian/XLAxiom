[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xlaxiom"
version = "0.5.3"
description = "Evidence-first differential testing and failure minimization for JAX and OpenXLA numerical workloads."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "XLAxiom contributors" }]
keywords = [
  "jax",
  "openxla",
  "xla",
  "compiler-testing",
  "differential-testing",
  "numerical-testing",
  "property-based-testing",
  "reproducibility",
  "failure-minimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=2.0", "jax>=0.5"]

[project.urls]
Homepage = "https://github.com/Hardonian/XLAxiom"
Documentation = "https://github.com/Hardonian/XLAxiom#readme"
Repository = "https://github.com/Hardonian/XLAxiom"
Issues = "https://github.com/Hardonian/XLAxiom/issues"
Changelog = "https://github.com/Hardonian/XLAxiom/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]
cuda12 = ["jax[cuda12]>=0.5; platform_system == 'Linux'"]
cuda13 = ["jax[cuda13]>=0.5; platform_system == 'Linux'"]

[project.scripts]
xlaxiom = "xlaxiom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xlaxiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
ignore_missing_imports = true
