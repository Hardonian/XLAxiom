# Add this block to .github/ISSUE_TEMPLATE/bug_report.yml in google/jax
- type: textarea
  id: xlaxiom_reproduction
  attributes:
    label: XLAxiom Standalone Reproduction (Optional)
    description: |
      If you generated this report using XLAxiom (`xlaxiom triage --case <path> --target jax`),
      paste the generated markdown snippet below. It includes a 10-line standalone reproduction
      script and jax.print_environment_info() output.
    placeholder: |
      ```python
      # Standalone reproduction script generated by XLAxiom
      import jax
      import jax.numpy as jnp
      ...
      ```
  validations:
    required: false

