name: Release verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(uv run python -c 'from xlaxiom import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          uv venv --python 3.12 .package-smoke
          uv pip install --python .package-smoke/bin/python dist/*.whl
          cd "$(mktemp -d)"
          "${GITHUB_WORKSPACE}/.package-smoke/bin/xlaxiom" --version
          "${GITHUB_WORKSPACE}/.package-smoke/bin/xlaxiom" property list
          "${GITHUB_WORKSPACE}/.package-smoke/bin/xlaxiom" corpus validate \
            --corpus "${GITHUB_WORKSPACE}/corpus/findings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: xlaxiom-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
