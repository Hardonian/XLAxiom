name: Release verification

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      - run: uv build
      - name: Verify reproducible distributions
        shell: bash
        run: |
          uv build --out-dir dist-repeat
          for artifact in dist/*; do
            cmp "${artifact}" "dist-repeat/$(basename "${artifact}")"
          done
      - run: uvx twine check dist/*
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(uv run python -c 'from xlaxiom import __version__; print(__version__)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          for python_version in 3.11 3.12 3.13; do
            environment="${RUNNER_TEMP}/xlaxiom-${python_version}"
            uv venv --python "${python_version}" "${environment}"
            uv pip install --python "${environment}/bin/python" \
              "${GITHUB_WORKSPACE}"/dist/*.whl
            cd "$(mktemp -d)"
            "${environment}/bin/xlaxiom" --version
            "${environment}/bin/xlaxiom" property list
            "${environment}/bin/xlaxiom" corpus validate \
              --corpus "${GITHUB_WORKSPACE}/corpus/findings.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: xlaxiom-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xlaxiom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xlaxiom-${{ github.ref_name }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
