name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install ${{ matrix.python-version }}
      - name: Verify lockfile
        run: uv lock --check
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Run tests
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-test-${{ matrix.python-version }}"
          mkdir -p "${diagnostics}"
          uv run pytest --junitxml="${diagnostics}/pytest.xml"
      - run: uv build
      - name: Capture CPU diagnostics
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-test-${{ matrix.python-version }}"
          mkdir -p "${diagnostics}"
          uv run xlaxiom doctor > "${diagnostics}/doctor.json"
          uv run xlaxiom property coverage --output "${diagnostics}/property-coverage.json"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/xlaxiom-test-${{ matrix.python-version }}
          if-no-files-found: warn

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - name: Verify lockfile
        run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --frozen
      - run: uv build
      - run: uv run python scripts/verify_distribution.py --dist-dir dist
      - run: uvx twine check dist/*
      - name: Smoke-test clean wheel and source distribution installs
        shell: bash
        run: |
          set -o pipefail
          diagnostics="${RUNNER_TEMP}/xlaxiom-package-smoke"
          mkdir -p "${diagnostics}"
          smoke_root="${RUNNER_TEMP}/xlaxiom-package-installs"

          run_smoke() {
            local kind="$1"
            local distribution="$2"
            local environment="${smoke_root}/${kind}-venv"
            local workdir="${smoke_root}/${kind}-work"

            uv venv --python 3.12 "${environment}"
            uv pip install --python "${environment}/bin/python" "${distribution}"
            mkdir -p "${workdir}"
            (
              cd "${workdir}"
              "${environment}/bin/python" -c 'from importlib.resources import files; assert files("xlaxiom").joinpath("py.typed").is_file()'
              "${environment}/bin/xlaxiom" --version
              "${environment}/bin/xlaxiom" property list
              "${environment}/bin/xlaxiom" corpus validate --corpus "${GITHUB_WORKSPACE}/corpus/findings.json"
              "${environment}/bin/xlaxiom" generate --synthetic --seed 7 --output original.json
              "${environment}/bin/xlaxiom" minimize --case original.json --output reduced.json
              "${environment}/bin/xlaxiom" reproduce --case reduced.json --output reproduction.json
              "${environment}/bin/xlaxiom" report --case reduced.json --output report
              test -f report/report.html
            )
          }

          {
            run_smoke wheel "${GITHUB_WORKSPACE}"/dist/*.whl
            run_smoke sdist "${GITHUB_WORKSPACE}"/dist/*.tar.gz
          } 2>&1 | tee "${diagnostics}/package-smoke.log"
      - name: Upload package smoke diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-smoke-diagnostics
          path: ${{ runner.temp }}/xlaxiom-package-smoke
          if-no-files-found: warn

  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        property:
          - add-commutativity-v1
          - transpose-involution-v1
          - reshape-roundtrip-v1
          - matmul-transpose-v1
          - negation-involution-v1
          - subtraction-as-addition-v1
          - absolute-idempotence-v1
          - integer-add-commutativity-v1
          - float64-add-commutativity-v1
          - mixed-dtype-add-commutativity-v1
          - signed-zero-negation-involution-v1
          - nonfinite-absolute-idempotence-v1
          - extreme-finite-absolute-idempotence-v1
          - maximum-commutativity-v1
          - minimum-commutativity-v1
          - min-max-duality-v1
          - square-as-multiplication-v1
          - square-negation-involution-v1
          - min-max-reduction-duality-v1
          - mul-commutativity-v1
          - min-max-addition-identity-v1
          - square-absolute-identity-v1
          - negation-multiplication-duality-v1
          - sum-negation-duality-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - name: Verify lockfile
        run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --frozen
      - name: Run property shard
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-property-${{ matrix.property }}"
          mkdir -p "${diagnostics}"
          uv run xlaxiom property run --property "${{ matrix.property }}" --backend jax-jit --x64 --output "${diagnostics}/evidence.json"
      - name: Upload property evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: property-${{ matrix.property }}
          path: ${{ runner.temp }}/xlaxiom-property-${{ matrix.property }}
          if-no-files-found: warn

  test-darwin:
    name: Test Darwin (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - name: Verify lockfile
        run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --frozen
      - name: Run test suite
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-darwin"
          mkdir -p "${diagnostics}"
          uv run pytest --junitxml="${diagnostics}/pytest.xml"
      - name: Capture Darwin diagnostics
        if: always()
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-darwin"
          mkdir -p "${diagnostics}"
          uv run xlaxiom doctor > "${diagnostics}/doctor.json" || true
          uv run xlaxiom property coverage --output "${diagnostics}/property-coverage.json" || true
      - name: Upload Darwin diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-diagnostics
          path: ${{ runner.temp }}/xlaxiom-darwin
          if-no-files-found: warn

  scheduled-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv python install 3.12
      - name: Verify lockfile
        run: uv lock --check
      - run: uv sync --python 3.12 --extra dev --frozen
      - name: Run scheduled property campaign
        shell: bash
        run: |
          diagnostics="${RUNNER_TEMP}/xlaxiom-scheduled-corpus"
          mkdir -p "${diagnostics}"
          uv run xlaxiom property campaign --cases 25 --backend jax-jit --x64 --output "${diagnostics}/evidence.json"
      - name: Upload scheduled campaign evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-corpus-evidence
          path: ${{ runner.temp }}/xlaxiom-scheduled-corpus
          if-no-files-found: warn
